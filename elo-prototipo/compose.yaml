name: elo-prototipo
services:
  app:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://elo:${POSTGRES_PASSWORD:?Execute npm run setup antes de iniciar}@db:5432/elo
      SESSION_SECRET: ${SESSION_SECRET:?Execute npm run setup antes de iniciar}
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    depends_on:
      db:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: elo
      POSTGRES_DB: elo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run setup antes de iniciar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  postgres_data:
